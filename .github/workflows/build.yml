name: Build AppleOps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project AppleOps.xcodeproj \
            -scheme AppleOps \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/AppleOps.app" Payload/
          zip -qry AppleOps.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleOps.ipa
          path: AppleOps.ipa

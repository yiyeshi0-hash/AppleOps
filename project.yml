name: AppleOps
options:
  bundleIdPrefix: com.yiyeshi0
  deploymentTarget:
    iOS: "17.0"
targets:
  AppleOps:
    type: application
    platform: iOS
    sources:
      - AppleOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiyeshi0.tools
        PRODUCT_NAME: AppleOps
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tools
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: AppleOps/AppleOps.entitlements
        TARGETED_DEVICE_FAMILY: "1"
